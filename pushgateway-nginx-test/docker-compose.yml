services:
  pushgateway:
    image: prom/pushgateway:latest
    command:
      - '--web.external-url=http://localhost:80/pushgateway/'

  nginx:
    image: nginx:alpine
    ports:
      - '80:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - pushgateway

  pusher:
    build: .
    depends_on:
      - nginx